<head>

  <!-- meta tags -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse, compare, buy, and sell cars across Saudi Arabia with SayaraMatch.">
  <meta name="keywords" content="cars Saudi Arabia, buy car, sell car, SayaraMatch">
  <meta name="theme-color" content="#f51e30">

  <!-- title -->
  <title>SayaraMatch | The Right Car. The Right Match.</title>

  <!-- favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/logo/sayaramatch-favicon.svg?v=3">
  <link rel="alternate icon" type="image/png" href="assets/img/logo/favicon.png?v=3">
  <link rel="shortcut icon" href="favicon.ico?v=3">
  <link rel="apple-touch-icon" href="assets/img/logo/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Discover web fonts immediately instead of waiting for style.css @import. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Roboto:wght@100;300;400;500;700;900&display=swap">

  <!-- Critical loader CSS must be available before the theme styles download. -->
  <style>
    #boot-preloader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #fff; }
    #boot-preloader .loader-ripple { position: relative; width: 80px; height: 80px; }
    #boot-preloader .loader-ripple div { position: absolute; border: 4px solid #f51e30; border-radius: 50%; animation: boot-loader-ripple 1s cubic-bezier(0, .2, .8, 1) infinite; }
    #boot-preloader .loader-ripple div:nth-child(2) { animation-delay: -.5s; }
    @keyframes boot-loader-ripple {
      0% { top: 36px; left: 36px; width: 0; height: 0; opacity: 1; }
      100% { top: 0; left: 0; width: 72px; height: 72px; opacity: 0; }
    }
  </style>

  <!-- Only the theme styles used by Angular templates are loaded globally. -->
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="./assets/css/all-fontawesome.min.css">
  <link rel="stylesheet" href="./assets/css/flaticon.css">
  <link rel="stylesheet" href="./assets/css/animate.min.css">
  <link rel="stylesheet" href="./assets/css/owl.carousel.min.css">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <!-- preloader -->
  <div id="boot-preloader" class="preloader" role="status" aria-label="Loading application">
    <div class="loader-ripple">
      <div></div>
      <div></div>
    </div>
  </div>
  <!-- preloader end -->
  <app-root></app-root>
</body>
<!-- scroll-top -->

<!-- scroll-top end -->
