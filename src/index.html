  <!-- Critical loader CSS must be available before the theme styles download. -->
  <style>
    #boot-preloader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 38%, #263653 0, #101828 48%, #080d18 100%); color: #fff; }
    #boot-preloader::before { position: absolute; width: min(78vw, 620px); aspect-ratio: 1; border: 1px solid rgb(255 255 255 / 5%); border-radius: 50%; box-shadow: 0 0 0 80px rgb(255 255 255 / 1.5%), 0 0 0 160px rgb(255 255 255 / 1%); content: ''; }
    #boot-preloader .boot-brand { position: relative; display: grid; justify-items: center; padding: 32px; text-align: center; animation: boot-brand-enter 500ms ease-out both; }
    #boot-preloader .boot-mark { width: clamp(112px, 27vw, 168px); height: auto; filter: drop-shadow(0 20px 28px rgb(0 0 0 / 28%)); }
    #boot-preloader .boot-name { margin-top: 28px; font: 800 clamp(34px, 9vw, 54px)/1 Inter, Arial, sans-serif; letter-spacing: -.055em; }
    #boot-preloader .boot-name b { color: #ff4050; font: inherit; }
    #boot-preloader .boot-tagline { margin: 10px 0 0; color: #aeb8ca; font: 700 clamp(10px, 2.6vw, 13px)/1.4 Inter, Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    #boot-preloader .boot-progress { width: 72px; height: 4px; margin-top: 52px; overflow: hidden; border-radius: 999px; background: rgb(255 255 255 / 12%); }
    #boot-preloader .boot-progress::after { display: block; width: 42%; height: 100%; border-radius: inherit; background: #f51e30; content: ''; animation: boot-progress 1.2s ease-in-out infinite; }
    @keyframes boot-brand-enter { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes boot-progress { 0% { transform: translateX(-120%); } 50% { transform: translateX(120%); } 100% { transform: translateX(300%); } }
    @media (prefers-reduced-motion: reduce) { #boot-preloader .boot-brand, #boot-preloader .boot-progress::after { animation: none; } }
  </style>

  <!-- Only the theme styles used by Angular templates are loaded globally. -->
  <link rel="stylesheet" href="./assets/css/bootstrap.min.css">

<body>

      <p class="boot-tagline">The right car · The right match</p>
      <div class="boot-progress" aria-hidden="true"></div>
    </div>
  </div>
  <!-- preloader end -->
  <app-root></app-root>
</body>
